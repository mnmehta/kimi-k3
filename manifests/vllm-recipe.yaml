# Up to 4-node recipe-shaped deployment matching
# https://recipes.vllm.ai/moonshotai/Kimi-K3 (TP16 / TEP16 = 2×8; P/D = 4×8).
# Pods sleep; launch vLLM via:
#   scripts/deploy-recipe.sh / deploy-recipe-dummy.sh             (TP16)
#   scripts/deploy-recipe-tep.sh                                  (TEP16)
#   scripts/deploy-recipe-pp.sh / deploy-recipe-dummy-pp.sh       (TP8×PP2)
#   scripts/deploy-recipe-dp.sh / deploy-recipe-dummy-dp.sh       (TP8×DP2)
#   scripts/deploy-recipe-pd.sh                                   (P/D 4×8)
#
# Storage: real CoreWeave local NVMe via hostPath /mnt/local/kimi-k3/models
# (see manifests/STORAGE.md). Survives pod delete on the same node; not node reboot.
# Legacy ephemeral: vllm-recipe-overlay.yaml.
apiVersion: v1
kind: Service
metadata:
  name: vllm-recipe
  namespace: kimi-k3
  labels:
    app: vllm-recipe
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: vllm-recipe
  ports:
  - name: http
    port: 8000
    targetPort: 8000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vllm-recipe
  namespace: kimi-k3
  labels:
    app: vllm-recipe
spec:
  serviceName: vllm-recipe
  replicas: 4
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: vllm-recipe
  template:
    metadata:
      labels:
        app: vllm-recipe
    spec:
      hostNetwork: true
      hostIPC: true
      dnsPolicy: ClusterFirstWithHostNet
      # Weights on hostPath NVMe — pin to the four H200 nodes (populate via
      # scripts/download-model.sh or scripts/sync-model-hostpath.sh).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: ["g1191e4", "g13c364", "g11cd44", "gf2a612"]
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: vllm-recipe
      containers:
      - name: vllm
        image: vllm/vllm-openai:kimi-k3
        imagePullPolicy: IfNotPresent
        command: ["sleep", "infinity"]
        securityContext:
          privileged: true
        ports:
        - name: http
          containerPort: 8000
          hostPort: 8000
        env:
        - name: NVIDIA_VISIBLE_DEVICES
          value: all
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: compute,utility
        - name: HF_HOME
          value: /models/hf
        - name: MODEL
          value: /models/Kimi-K3
        volumeMounts:
        - name: model
          mountPath: /models
        resources:
          limits:
            nvidia.com/gpu: "8"
            rdma/ib: "1"
          requests:
            nvidia.com/gpu: "8"
            rdma/ib: "1"
            cpu: "16"
            memory: 64Gi
            # Weights ~1.56Ti live on hostPath (not counted as ephemeral-storage),
            # but leave headroom for logs/scratch on the local NVMe.
            ephemeral-storage: 50Gi
      volumes:
      - name: model
        hostPath:
          # CoreWeave local NVMe RAID — NOT /var/lib (small/ram0 on some paths).
          path: /mnt/local/kimi-k3/models
          type: DirectoryOrCreate
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
