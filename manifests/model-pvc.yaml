# Shared model volume for moonshotai/Kimi-K3 (~1.56 TB weights).
# RWX so the download Job and both recipe ranks can mount the same claim.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kimi-k3-model
  namespace: kimi-k3
  labels:
    app: kimi-k3
    component: model-weights
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: shared-vast
  resources:
    requests:
      storage: 4Ti
