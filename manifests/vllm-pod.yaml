apiVersion: v1
kind: Pod
metadata:
  name: vllm
  namespace: kimi-k3
  labels:
    app: vllm
spec:
  containers:
  - name: vllm
    image: vllm/vllm-openai:kimi-k3
    command: ["sleep", "infinity"]
    resources:
      limits:
        nvidia.com/gpu: "8"
      requests:
        nvidia.com/gpu: "8"
  restartPolicy: Always
