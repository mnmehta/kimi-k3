name: Deploy Quarto to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: reports/requirements.txt

      - name: Install Python deps + Jupyter kernel
        run: |
          python -m pip install --upgrade pip
          pip install -r reports/requirements.txt
          python -m ipykernel install --user \
            --name=kimi-k3-reports \
            --display-name="Python (kimi-k3 reports)"

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Cache MLflow GuideLLM aggregates
        uses: actions/cache@v4
        with:
          path: reports/.mlflow-cache
          key: mlflow-guidellm-${{ hashFiles('reports/mlflow_guidellm.py', 'reports/pp2-humming-vllmbench-vs-mlflow-1000-1000.qmd') }}
          restore-keys: |
            mlflow-guidellm-

      - name: Render reports
        env:
          MLFLOW_TRACKING_URI: https://mlflow.apps.psap-automation.ibm.rhperfscale.org
          MLFLOW_WORKSPACE: benchflow
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
          MLFLOW_TRACKING_INSECURE_TLS: "true"
        run: |
          quarto render reports/tp16-vs-pp2-1000-1000.qmd --to html
          quarto render reports/concurrency-sweep-1000-1000.qmd --to html
          quarto render reports/repro-1000-1000.qmd --to html
          quarto render reports/pp2-marlin-vs-humming-1000-1000.qmd --to html
          quarto render reports/pp2-humming-vllmbench-vs-mlflow-1000-1000.qmd --to html
          quarto render reports/agentx-mvp-pp2-humming.qmd --to html
          quarto render reports/agentx-mvp-pp2-humming-kv-offload.qmd --to html
          quarto render reports/sglang-kimi-k3-1000-1000.qmd --to html
          quarto render reports/sglang-vs-vllm-pp-1000-1000.qmd --to html
          quarto render reports/sglang-agentx-mvp.qmd --to html
          mkdir -p _site
          # Keep index.html as the primary recipe report (existing links).
          cp reports/tp16-vs-pp2-1000-1000.html _site/index.html
          cp reports/concurrency-sweep-1000-1000.html _site/concurrency-sweep-1000-1000.html
          cp reports/repro-1000-1000.html _site/repro-1000-1000.html
          cp reports/pp2-marlin-vs-humming-1000-1000.html _site/pp2-marlin-vs-humming-1000-1000.html
          cp reports/pp2-humming-vllmbench-vs-mlflow-1000-1000.html _site/pp2-humming-vllmbench-vs-mlflow-1000-1000.html
          cp reports/agentx-mvp-pp2-humming.html _site/agentx-mvp-pp2-humming.html
          cp reports/agentx-mvp-pp2-humming-kv-offload.html _site/agentx-mvp-pp2-humming-kv-offload.html
          cp reports/sglang-kimi-k3-1000-1000.html _site/sglang-kimi-k3-1000-1000.html
          cp reports/sglang-vs-vllm-pp-1000-1000.html _site/sglang-vs-vllm-pp-1000-1000.html
          cp reports/sglang-agentx-mvp.html _site/sglang-agentx-mvp.html
          cp reports/kimireports.html _site/kimireports.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
