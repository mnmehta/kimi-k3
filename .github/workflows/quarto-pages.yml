name: Deploy Quarto to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: reports/requirements.txt

      - name: Install Python deps + Jupyter kernel
        run: |
          python -m pip install --upgrade pip
          pip install -r reports/requirements.txt
          python -m ipykernel install --user \
            --name=kimi-k3-reports \
            --display-name="Python (kimi-k3 reports)"

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Render report
        run: |
          quarto render reports/concurrency-sweep-1000-1000.qmd --to html
          mkdir -p _site
          cp reports/concurrency-sweep-1000-1000.html _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
