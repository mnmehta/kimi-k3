# multi_node_tp_dp — TP8 × DP2 (H200-tight knobs).
name: strategy-dp2
description: Multi-Node TP + Data Parallel (TP8×DP2)

env:
  TP_SIZE: 8
  PP_SIZE: 1
  DP_SIZE: 2
  DP_SIZE_LOCAL: 1
  NNODES: 2
  DP_RPC_PORT: 13345
  VLLM_USE_RUST_FRONTEND: 0
  VLLM_USE_V2_MODEL_RUNNER: 0
  GPU_MEM_UTIL: "0.97"
  VLLM_FLASHINFER_WORKSPACE_BUFFER_SIZE: 67108864
  MAX_NUM_SEQS: 2
  MAX_MODEL_LEN: 2048
  MAX_NUM_BATCHED_TOKENS: 256
  KV_CACHE_MEMORY_BYTES: 160000000
  SKIP_MM_PROFILING: 1
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  NCCL_DMABUF_ENABLE: 0
