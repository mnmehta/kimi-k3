# Gemma-4 26B-A4B NVFP4: single-node, single-GPU text serve defaults.
# Mirrors gemma4-1gpu (FP8) knobs for an apples-to-apples concurrency compare.
name: gemma4-nvfp4-1gpu
description: TP=1 single GPU Gemma-4 NVFP4 (text-only)
deploy_mode: multi_node
verify_weights: true
serve_script: scripts/run-vllm-kimi-k3-recipe.sh

env:
  NNODES: 1
  TP_SIZE: 1
  PP_SIZE: 1
  DP_SIZE: 1
  # Pod still requests 8 GPUs (STS); serve uses TP=1 on one device.
  GPUS_PER_NODE: 8
  MODEL: /models/gemma-4-26B-A4B-it-NVFP4
  MODEL_PATH: /models/gemma-4-26B-A4B-it-NVFP4
  GPU_MEM_UTIL: "0.95"
  MAX_MODEL_LEN: 32768
  MAX_NUM_SEQS: 256
  MAX_NUM_BATCHED_TOKENS: 16384
  MOE_BACKEND: null
  ATTENTION_BACKEND: null
  KV_CACHE_DTYPE: fp8
  BLOCK_SIZE: 32
  ENABLE_CHUNKED_PREFILL: 1
  ENABLE_PREFIX_CACHING: 1
  ENABLE_AUTO_TOOL_CHOICE: 1
  TOOL_CALL_PARSER: gemma4
  REASONING_PARSER: gemma4
  LIMIT_MM_PER_PROMPT: '{"image":0,"audio":0}'
  CHAT_TEMPLATE: /vllm-workspace/examples/tool_chat_template_gemma4.jinja
  SKIP_MM_PROFILING: 0
  VLLM_USE_V2_MODEL_RUNNER: 1
