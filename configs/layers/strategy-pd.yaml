# pd_cluster — TEP16 prefill + TEP16 decode on 4×8 + router.
name: strategy-pd
description: Prefill/Decode disaggregation (4×8 H200)
deploy_mode: pd
health_port: 8001
health_timeout_polls: 360

env:
  NNODES: 4
  TP_SIZE: 16
  PP_SIZE: 1
  DP_SIZE: 1
  ENABLE_EXPERT_PARALLEL: 1
  GPU_MEM_UTIL: "0.97"
  MAX_MODEL_LEN: 8192
  MAX_NUM_BATCHED_TOKENS: 4096
  VLLM_USE_RUST_FRONTEND: 0
  VLLM_USE_V2_MODEL_RUNNER: 1
  NCCL_DMABUF_ENABLE: 0
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  ENABLE_CUMEM_ALLOCATOR: 0
  NO_DISABLE_HYBRID_KV_CACHE_MANAGER: 1
  VLLM_SSM_CONV_STATE_LAYOUT: DS
  UCX_NET_DEVICES: all
  PREFILL_PORT: 8001
  DECODE_PORT: 8002
  NIXL_PREFILL_PORT: 5557
  NIXL_DECODE_PORT: 5558
  PREFILL_MAX_NUM_SEQS: 5
  DECODE_MAX_NUM_SEQS: 16
  PREFILL_ENFORCE_EAGER: 1
  KV_BUFFER_SIZE: 33554432
  KV_BUFFER_DEVICE: cpu
  ROUTER_PORT: 8000
  NNODES_PER_ROLE: 2

pd:
  prefill_pods: [0, 1]
  decode_pods: [2, 3]
  start_router: false
